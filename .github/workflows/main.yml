name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm install

      - name: Criar projeto Android (Capacitor)
        run: npx cap add android

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Ícone e tela de abertura do Omni RP
        run: |
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_background.xml
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          find android/app/src/main/res -name 'ic_launcher*.webp' -delete
          cp -r resources/android/res/. android/app/src/main/res/
          sed -i 's#<string name="app_name">.*</string>#<string name="app_name">Omni RP</string>#; s#<string name="title_activity_main">.*</string>#<string name="title_activity_main">Omni RP</string>#' android/app/src/main/res/values/strings.xml

      - name: Compilar APK (debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: omni-rp-apk
          path: android/app/build/outputs/apk/debug/*.apk
