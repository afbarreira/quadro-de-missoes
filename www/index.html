*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--fb);transition:background-color .3s;color:var(--text);font-size:16.5px;line-height:1.45;background:var(--bg)}
h1,h2,h3,.cinzel{font-family:var(--fh);letter-spacing:.02em;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:960px;margin:0 auto;padding:14px 16px 120px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap-r{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.hidden{display:none!important}

/* botões */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font-weight:700;font-size:15px;transition:background .15s,transform .08s}
.btn:active{transform:scale(.98)}
.btn.gold{background:var(--accent);color:var(--on-acc);border-color:transparent}
.btn.red{background:transparent;color:var(--danger);border-color:#5a2e28}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}
.iconbtn{width:38px;height:38px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;background:var(--surface2);border:1px solid var(--line);cursor:pointer;font-size:17px;flex:none;color:var(--text)}

/* campos */
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.in{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);outline:none;transition:border-color .15s}
.in:focus{border-color:var(--accent)}
textarea.in{min-height:90px;resize:vertical;line-height:1.45}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 55%,calc(100% - 13px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* superfícies */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.panel h3{margin:0 0 10px;font-size:15px;color:var(--accent)}
.parch{color:var(--ink);background:var(--paper);border-radius:14px}
.parch .muted{color:var(--ink2)}

/* topo */
.topbar{position:sticky;top:0;z-index:20;background:var(--bar);border-bottom:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.topbar .in-top{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.topbar .title{font-family:var(--fh);font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid currentColor;white-space:nowrap;opacity:.95}
.tag.t20{color:#e0a866}.tag.custom{color:#9fc0d9}.tag.master{color:var(--accent)}.tag.player{color:#a9c98f}
.avatar{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;font-size:14px}
.avatar.sm{width:28px;height:28px;font-size:12px}

/* barra inferior */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--bar);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tabbar .in-tab{max-width:560px;margin:0 auto;display:flex;gap:4px}
.tabbar button{flex:1;background:none;border:0;padding:6px 2px;border-radius:12px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;position:relative}
.tabbar button .ic{font-size:20px;line-height:1;filter:grayscale(.6);opacity:.8}
.tabbar button.on{color:var(--accent)}
.tabbar button.on .ic{filter:none;opacity:1}
.badge{position:absolute;top:2px;right:calc(50% - 22px);background:#c0574a;color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* chips e busca */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;color:var(--text);white-space:nowrap}
.chip.on{background:var(--accent);color:var(--on-acc);border-color:transparent;font-weight:700}
.chip .n{opacity:.6;margin-left:4px;font-size:12px}
.chip .dotc{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.search{position:relative}
.search input{padding-left:36px}
.search::before{content:'⌕';position:absolute;left:13px;top:50%;transform:translateY(-52%);font-size:19px;color:var(--muted)}

/* quadro */
.board-tools{margin-bottom:12px}
.board-tools .chips{margin-top:10px}
.board-wrap{position:relative;width:100%}
.board{position:absolute;top:0;left:0;width:440px;transform-origin:0 0;border-radius:10px;background:var(--board);border:9px solid var(--frame);box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 0 40px rgba(0,0,0,.22)}
.board .corner{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--rivet);box-shadow:inset -1px -1px 0 rgba(0,0,0,.4)}
.board-sign{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:7px 22px;background:var(--sign-bg);border:2px solid var(--sign-bd);border-radius:6px;font-family:var(--fh);font-weight:800;font-size:18px;color:var(--sign-fg);white-space:nowrap;box-shadow:0 4px 8px rgba(0,0,0,.3)}
.board-sign::before,.board-sign::after{content:'';position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#b8aa97}
.board-sign::before{left:7px}.board-sign::after{right:7px}
.board-empty{position:absolute;left:40px;right:40px;top:150px;text-align:center;color:var(--board-fg);text-shadow:0 1px 3px rgba(0,0,0,.6)}
.poster{position:absolute;transform:rotate(var(--rot)) scale(var(--sc,1));filter:drop-shadow(0 5px 7px rgba(0,0,0,.33));cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;transition:transform .15s,opacity .2s,filter .15s}
.poster.s-disponivel{--pp:var(--s-disp)}.poster.s-andamento{--pp:var(--s-and)}.poster.s-concluida{--pp:var(--s-conc)}.poster.s-falhou{--pp:var(--s-fail)}
.paper{position:relative;width:100%;height:100%;background:var(--pp);color:var(--ink);padding:18px 14px 12px;display:flex;flex-direction:column;overflow:hidden;border-radius:2px}
.paper::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 25% 12%,rgba(255,255,255,.32),transparent 55%);pointer-events:none}
.poster.dragging{--sc:1.06;filter:drop-shadow(0 16px 18px rgba(0,0,0,.45));cursor:grabbing;transition:none;z-index:999!important}
.poster.dim{opacity:.18;pointer-events:none}
.poster.is-hidden .paper{opacity:.7;outline:2px dashed rgba(58,42,28,.5);outline-offset:-7px}
.v-torn .paper{clip-path:polygon(0 3%,10% 0,22% 2%,35% 0,50% 1.5%,63% 0,78% 2%,90% 0,100% 2%,99% 25%,100% 50%,98.5% 75%,100% 97%,88% 100%,75% 98%,60% 100%,45% 98.5%,30% 100%,15% 98%,0 100%,1.5% 70%,0 45%,1% 20%)}
.v-frame .paper,.v-wanted .paper{text-align:center;box-shadow:inset 0 0 0 6px var(--pp),inset 0 0 0 7.5px rgba(58,42,28,.5)}
.v-frame .paper::before,.v-wanted .paper::before{content:'❖';position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink2);background:var(--pp);padding:0 5px;line-height:1.2}
.v-note .paper{padding-top:20px}
.nail{position:absolute;top:7px;width:7px;height:7px;border-radius:50%;background:#9a8f82;box-shadow:inset -1px -1px 0 rgba(0,0,0,.35);z-index:2}
.nail.l{left:9px}.nail.r{right:9px}
.pin{position:absolute;top:6px;left:50%;margin-left:-6px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d9a8,#a8803f 55%,#5c4116);z-index:2}
.seal{position:absolute;top:12px;right:12px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#cf5a4d,#8c291f);z-index:2}
.ph{font-family:var(--fh);font-weight:800;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-bottom:3px}
.v-frame .ph{font-size:17px;letter-spacing:.06em;color:var(--ink);text-transform:none;margin-top:4px}
.v-wanted .ph{font-family:'Pirata One',serif;font-weight:400;font-size:28px;letter-spacing:.02em;text-transform:none;color:var(--ink);line-height:1;margin-top:2px}
.v-note .ph{font-family:'Caveat',cursive;font-size:25px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--ink);line-height:1}
.pt{font-family:var(--fp);font-style:italic;font-weight:700;font-size:18px;line-height:1.15;margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ph,.pt,.pm,.pfoot,.portrait{flex-shrink:0}
.pd{flex:1 1 auto;min-height:0;overflow:hidden;font-family:var(--fp);font-style:italic;font-size:13.5px;line-height:1.3;color:var(--ink2);margin-top:6px;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);mask-image:linear-gradient(180deg,#000 70%,transparent)}
.v-note .pd{font-family:'Caveat',cursive;font-style:normal;font-size:17px;line-height:1.15}
.pm{font-size:13px;color:var(--ink2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.portrait{width:74px;height:58px;margin:5px auto 6px;border:1.5px solid rgba(58,42,28,.5);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.pprog{height:4px;border-radius:9px;background:rgba(58,42,28,.15);margin:8px 0 0;overflow:hidden;flex:none}
.pprog i{display:block;height:100%;background:var(--ink2);border-radius:9px}
.pfoot{margin-top:auto;padding-top:8px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px;text-align:left}
.pr{font-weight:800;font-size:13.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ps{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:rgba(58,42,28,.13);white-space:nowrap;flex:none}
.hint{text-align:center;font-size:13px;color:var(--muted);margin:10px 0 0}
.hist{display:flex;gap:16px;align-items:center;cursor:pointer;margin-top:16px;padding:14px 16px}
.stack{position:relative;width:54px;height:62px;flex:none}
.stack i{position:absolute;inset:0;border-radius:2px;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.fab{position:fixed;right:16px;bottom:88px;z-index:25;border-radius:999px;padding:13px 20px;box-shadow:0 8px 20px rgba(0,0,0,.5)}

/* listas */
.empty{text-align:center;padding:30px 14px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:6px}
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);margin-bottom:8px}
.item .t{font-weight:700}
.camp{cursor:pointer;position:relative}
.camp h3{margin:0 0 4px;font-size:18px;color:var(--text)}
.camp::after{content:'›';position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:26px;color:var(--muted)}
.code{font-family:var(--fh);font-size:24px;font-weight:800;letter-spacing:.18em;color:var(--accent);text-align:center;padding:10px;border:1.5px dashed var(--line2);border-radius:12px}
.inv-btn{cursor:pointer}
.eqchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.eqchip{font-size:13px;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line2);color:var(--text)}
.irow{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);margin-bottom:8px}
.irow.eq{border-color:var(--line2);background:var(--sel)}
.eqmark{color:var(--accent);font-size:16px}
.qty{display:flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:10px;flex:none}
.qty button{width:30px;height:32px;border:0;background:none;cursor:pointer;font-weight:800;color:var(--text);font-size:16px}
.qty span{min-width:18px;text-align:center;font-weight:700}
.sec-label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.hrow{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.hrow .chipcol{width:10px;align-self:stretch;border-radius:4px;flex:none}

/* modal */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.overlay.anim{animation:fade .15s}.overlay.anim .modal{animation:up .2s ease-out}
.modal{width:100%;max-width:680px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;background:var(--surface);border:1px solid var(--line);border-bottom:0;padding:0 16px 24px;overscroll-behavior:contain}
@media(min-width:760px){.overlay{align-items:center}.modal{border-radius:20px;border-bottom:1px solid var(--line)}}
.mhead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 0;background:var(--surface);margin-bottom:6px}
.mhead h2{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:8px auto 0}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04)}
.detail-parch{padding:18px 16px;margin-bottom:14px}
.detail-parch.s-disponivel{background:var(--s-disp)}.detail-parch.s-andamento{background:var(--s-and)}.detail-parch.s-concluida{background:var(--s-conc)}.detail-parch.s-falhou{background:var(--s-fail)}
.detail-parch h2{font-family:var(--fp);font-style:italic;font-size:25px;margin:4px 0 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:15.5px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);margin-bottom:8px;cursor:pointer}
.check .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line2);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--on-acc);font-size:14px}
.check.done .box{background:var(--accent);border-color:var(--accent)}
.check.done .txt{text-decoration:line-through;color:var(--muted)}
.check .who{font-size:13px;color:var(--muted);margin-top:2px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:90;background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:12px;font-weight:700;box-shadow:0 8px 20px rgba(0,0,0,.45);animation:up .2s;max-width:90vw;text-align:center}
.saved{font-size:13px;color:#9fc38a;min-height:18px}
.stamp{font-weight:800;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;color:#fff}
.st-disponivel{background:var(--c-disp)}.st-andamento{background:var(--c-and)}.st-concluida{background:var(--c-conc)}.st-falhou{background:var(--c-fail)}
.progress{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px}

/* importar pdf */
.drop{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:26px 16px;border:1.5px dashed var(--line2);border-radius:16px;background:var(--field);text-align:center;cursor:pointer;margin-bottom:12px;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--sel)}
.drop input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.drop .big{font-size:34px}
.perm{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);margin-bottom:12px;font-size:14px}

/* ficha */
.sheet-head{padding:16px;margin-bottom:12px}
.sheet-head h2{margin:2px 0 0;font-family:var(--fh);font-size:20px;color:var(--ink)}
.attrs{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:12px 0}
.attr{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 2px}
.attr .l{font-size:11.5px;color:var(--muted);font-weight:800;letter-spacing:.06em}
.attr .v{font-size:22px;font-weight:800;line-height:1.15}
@media(max-width:420px){.attrs{grid-template-columns:repeat(3,1fr)}}
.res{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.res .top{display:flex;justify-content:space-between;align-items:center}
.res .lab{font-weight:700;font-size:14px}
.res .num{font-size:21px;font-weight:800}
.bar{height:8px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:999px;transition:width .2s}
.bar.pv i{background:#c4594c}.bar.pm i{background:#5b8ec0}.bar.gen i{background:var(--accent)}
.stepper{display:flex;gap:6px}
.stepper button{flex:1;padding:7px 0;border-radius:9px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:700}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.stat .l{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.06em}
.stat .v{font-size:19px;font-weight:800}
.skills{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:420px){.skills{grid-template-columns:1fr}}
.skill{display:flex;align-items:center;gap:8px;padding:6px 2px;border-bottom:1px solid var(--line)}
.skill .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line2);flex:none}
.skill.tr .dot{background:var(--accent);border-color:var(--accent)}
.skill .n{flex:1;min-width:0;font-size:15px}
.skill .a{font-size:11px;color:var(--muted);font-weight:700}
.skill .v{font-weight:800;min-width:30px;text-align:right}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{font-size:11px;color:var(--muted);text-align:left;padding:4px;font-weight:800;letter-spacing:.05em}
.tbl td{padding:7px 4px;border-top:1px solid var(--line)}
details.pw{background:var(--surface2);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;padding:0 12px}
details.pw summary{cursor:pointer;padding:10px 0;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center}
details.pw summary::before{content:'›';color:var(--accent);font-size:18px;transition:transform .15s;display:inline-block}
details.pw[open] summary::before{transform:rotate(90deg)}
details.pw summary .sub{font-weight:400;font-size:13px;color:var(--muted)}
details.pw p{margin:0 0 10px;color:var(--text);white-space:pre-wrap}

/* montador */
.bsec{border:1px dashed var(--line2);border-radius:14px;padding:12px;margin-bottom:12px}
.bfield{display:grid;grid-template-columns:1fr 128px auto;gap:6px;align-items:center;margin-bottom:6px}
.bfield .opts{grid-column:1/-1}
.mini{display:flex;gap:4px}
.mini button{width:34px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;color:var(--text)}
.cstat{text-align:center}
.cstat input{text-align:center;font-size:21px;font-weight:800}

/* login */
.login{max-width:430px;margin:0 auto;padding:36px 16px 60px}
.banner{text-align:center;margin:0 0 4px}
.banner h1{margin:0;font-size:28px;color:var(--accent)}
.banner-sub{text-align:center;color:var(--muted);margin:4px 0 22px}
.testacc{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:8px;cursor:pointer;text-align:left;color:var(--text)}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:22px 0 12px;font-weight:700;letter-spacing:.05em}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
.err{color:var(--danger);font-size:14px;min-height:18px;margin:-4px 0 8px}
.sw{position:relative;width:44px;height:26px;border-radius:999px;background:var(--field);border:1px solid var(--line);cursor:pointer;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#6b5a48;transition:left .15s}
.sw.on{background:var(--accent);border-color:transparent}
.sw.on::after{left:22px;background:#fff8ea}
/* mapa */
.mapview{position:relative;overflow:hidden;touch-action:none;background:#5f7f80;user-select:none;-webkit-user-select:none;height:70vh}
.mapc{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.mapc.fly{transition:transform .38s cubic-bezier(.2,.7,.2,1)}
.mapc img{display:block;pointer-events:none;-webkit-user-drag:none;max-width:none}
.mapsvg{position:absolute;left:0;top:0;overflow:visible}
.rg{fill:var(--rc);fill-opacity:.16;stroke:var(--rc);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer}
.rg-hidden{stroke-dasharray:6 5;fill-opacity:.07}

<script>
// ===== Leitor de ficha Tormenta20 (padrão "Fichas de Nimb" v3, PDF com campos de formulário) =====
const T20_SKILLS = [
  ['Acrobacia','DES'],['Adestramento','CAR'],['Atletismo','FOR'],['Atuação','CAR'],['Cavalgar','DES'],
  ['Conhecimento','INT'],['Cura','SAB'],['Diplomacia','CAR'],['Enganação','CAR'],['Fortitude','CON'],
  ['Furtividade','DES'],['Guerra','INT'],['Iniciativa','DES'],['Intimidação','CAR'],['Intuição','SAB'],
  ['Investigação','INT'],['Jogatina','CAR'],['Ladinagem','DES'],['Luta','FOR'],['Misticismo','INT'],
  ['Nobreza','INT'],['Ofício','INT'],['Ofício','INT'],['Percepção','SAB'],['Pilotagem','DES'],
  ['Pontaria','DES'],['Reflexos','DES'],['Religião','SAB'],['Sobrevivência','SAB'],['Vontade','SAB']
];
const T20_ONLY_TRAINED = ['Adestramento','Conhecimento','Guerra','Jogatina','Ladinagem','Misticismo','Nobreza','Ofício','Pilotagem','Religião'];
const T20_ATTRS = ['FOR','DES','CON','INT','SAB','CAR'];

function t20num(v, d = 0) {
  if (v === undefined || v === null) return d;
  const m = String(v).replace(',', '.').match(/-?\d+(\.\d+)?/);
  return m ? Number(m[0]) : d;
}
function t20str(v) {
  if (v === undefined || v === null) return '';
  const s = String(v).trim();
  return (s === 'Off' || s === 'undefined' || s === 'null') ? '' : s;
}
function t20bool(v) {
  const s = t20str(v).toLowerCase();
  return !!s && s !== 'off' && s !== 'false' && s !== 'no' && s !== 'nao' && s !== 'não';
}
function t20attrFromSel(v, fallback) {
  const s = t20str(v).replace(/^mod/i, '').toUpperCase();
  return T20_ATTRS.includes(s) ? s : fallback;
}

// Recalcula totais das perícias a partir de nível + atributos
function t20recalc(sheet) {
  const half = Math.floor((Number(sheet.nivel) || 1) / 2);
  sheet.pericias.forEach(p => {
    p.total = half + (Number(sheet.atributos[p.atributo]) || 0) + (Number(p.treino) || 0) + (Number(p.outros) || 0);
  });
  return sheet;
}

function t20blank(nome = '') {
  const s = {
    sistema: 't20', nome, jogador: '', raca: '', origem: '', classe: '', nivel: 1, divindade: '',
    atributos: { FOR: 0, DES: 0, CON: 0, INT: 0, SAB: 0, CAR: 0 },
    pv: { max: 0, atual: 0 }, pm: { max: 0, atual: 0 },
    defesa: { total: 10, atributo: 'DES', outros: 0 }, deslocamento: '9m',
    pericias: T20_SKILLS.map(([nome, at]) => ({ nome, atributo: at, treinado: false, treino: 0, outros: 0, total: 0, soTreinado: T20_ONLY_TRAINED.includes(nome) })),
    ataques: [], armaduras: [], proficiencias: '', equipamento: [], dinheiro: { ts: '', to: '' },
    carga: { atual: '', maxima: '', levantar: '' }, tamanho: 'Médio', manobras: '', cdMagia: '', atributoMagia: 'INT',
    poderes: '', magias: '', descricao: '', anotacoes: '', xp: '', entreAventuras: '', extras: [], origemImport: ''
  };
  return t20recalc(s);
}

// fields: { nomeDoCampo: valor }  ·  extraPages: textos das páginas sem formulário (pág. 4 em diante)
function t20FromFields(fields, extraPages = []) {
  const F = k => t20str(fields[k]);
  const s = t20blank(F('Nome'));
  s.jogador = F('Jogador'); s.raca = F('Raca'); s.origem = F('Origem'); s.classe = F('Classe');
  s.divindade = F('Divindade');
  s.nivel = t20num(F('nivel'), 0) || t20num(F('Classe'), 1) || 1;
  T20_ATTRS.forEach(a => { s.atributos[a] = t20num(fields['mod' + a[0] + a.slice(1).toLowerCase()]); });
  s.pv = { max: t20num(F('vidaMax')), atual: F('vidaAtual') === '' ? t20num(F('vidaMax')) : t20num(F('vidaAtual')) };
  s.pm = { max: t20num(F('manaMax')), atual: F('manaAtual') === '' ? t20num(F('manaMax')) : t20num(F('manaAtual')) };
  s.defesa = { total: t20num(F('Texto13'), 10), atributo: t20attrFromSel(F('modDef'), 'DES'), outros: t20num(F('defesaOutros')) };
  s.deslocamento = F('deslocamento') ? (/m$/i.test(F('deslocamento')) ? F('deslocamento') : F('deslocamento') + 'm') : '9m';

  s.pericias = T20_SKILLS.map(([nome, at], i) => {
    const n = i + 1;
    let label = nome;
    if (n === 22 && F('Texto8')) label = `Ofício (${F('Texto8')})`;
    if (n === 23 && F('Texto9')) label = `Ofício (${F('Texto9')})`;
    const totalRaw = n === 23 ? (F('total23') || F('tota23')) : F('total' + n);
    return {
      nome: label, atributo: t20attrFromSel(F('modSelect' + i), at),
      treinado: t20bool(fields['treinado' + n]), treino: t20num(F('treino' + i)), outros: t20num(F('outros' + n)),
      total: totalRaw === '' ? null : t20num(totalRaw), soTreinado: T20_ONLY_TRAINED.includes(nome)
    };
  });
  // Remove o segundo "Ofício" se estiver vazio e sem treino
  s.pericias = s.pericias.filter((p, i) => !(i === 22 && p.nome === 'Ofício' && !p.treinado && !p.treino));

  for (let i = 1; i <= 5; i++) {
    const nome = F('ataque' + i);
    if (nome) s.ataques.push({ nome, teste: F('tAtak' + i), dano: F('dano' + i), critico: F('critico' + i), tipo: F('tipo' + i), alcance: F('alcance' + i) });
  }
  for (let i = 1; i <= 2; i++) {
    const nome = F('armadura' + i);
    if (nome) s.armaduras.push({ nome, defesa: F('defesa' + i), penalidade: F('penalidade' + i) });
  }
  s.proficiencias = F('caracteristicas');
  s.equipamento = [F('item1'), F('item2')].join('\n').split(/\n+/).map(x => x.trim()).filter(Boolean);
  s.dinheiro = { ts: F('T$'), to: F('TO') };
  s.carga = { atual: F('cargaAtual'), maxima: F('cargaMaxima'), levantar: F('levantar') };
  s.tamanho = F('modTamanho') || 'Médio'; s.manobras = F('manobras');
  s.cdMagia = F('Resistencia'); s.atributoMagia = t20attrFromSel(F('modSelectMagia'), 'INT');
  // Neste padrão o campo "Historico" fica sob o título PODERES e "Atualização" sob MAGIAS
  s.poderes = [F('Habilidades de Raça e Origem'), F('Habilidades de classe e poderes'), F('Historico')].filter(Boolean).join('\n');
  s.magias = [F('Magias'), F('Atualização')].filter(Boolean).join('\n');
  s.descricao = F('Descrição'); s.anotacoes = F('Anotações');
  s.xp = F('Pontos de Experiencia'); s.entreAventuras = F('Entre aventuras');

  // Páginas extras (texto livre): blocos com título + linhas
  const blocks = [];
  extraPages.join('\n').split(/\n/).map(l => l.trim()).filter(Boolean).forEach(line => {
    const isItem = /^[-•*]/.test(line);
    if (!isItem && line.length <= 40 && !/[.:]$/.test(line) && (blocks.length === 0 || blocks[blocks.length - 1].linhas.length > 0)) {
      blocks.push({ titulo: line, linhas: [] });
    } else if (blocks.length) {
      blocks[blocks.length - 1].linhas.push(line.replace(/^(undefined|null),\s*/i, ''));
    }
  });
  blocks.forEach(b => {
    if (/^of[ií]cios/i.test(b.titulo)) {
      b.linhas.forEach(l => {
        const m = l.match(/Of[ií]cio\s*\(([^)]+)\)\s*:?\s*(?:treino\s*(-?\d+))?/i);
        if (m) s.pericias.push({ nome: `Ofício (${m[1]})`, atributo: 'INT', treinado: true, treino: t20num(m[2]), outros: 0, total: null, soTreinado: true });
      });
    } else s.extras.push(b);
  });

  // Totais ausentes são calculados
  const half = Math.floor(s.nivel / 2);
  s.pericias.forEach(p => { if (p.total === null) p.total = half + (s.atributos[p.atributo] || 0) + p.treino + p.outros; });
  s.origemImport = 'PDF Fichas de Nimb';
  return s;
}

// Lê um ArrayBuffer de PDF com pdf.js (window.pdfjsLib)
async function t20ParsePdf(arrayBuffer) {
  const pdfjs = window.pdfjsLib;
  if (!pdfjs) throw new Error('Leitor de PDF não carregou. Verifique a conexão.');
  const doc = await pdfjs.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
  const fields = {};
  try {
    const objs = await doc.getFieldObjects();
    if (objs) Object.entries(objs).forEach(([k, arr]) => {
      const first = (arr || []).find(o => o && o.value !== undefined && o.value !== '' && o.value !== 'Off') || (arr || [])[0];
      if (first) fields[k] = Array.isArray(first.value) ? first.value[0] : first.value;
    });
  } catch (e) { /* tenta pelas anotações */ }
  if (Object.keys(fields).length === 0) {
    for (let p = 1; p <= doc.numPages; p++) {
      const page = await doc.getPage(p);
      (await page.getAnnotations()).forEach(a => {
        if (a.fieldName && fields[a.fieldName] === undefined) fields[a.fieldName] = a.checkBox ? (a.fieldValue && a.fieldValue !== 'Off' ? 'sim' : '') : a.fieldValue;
      });
    }
  }
  if (!('Nome' in fields) && !('modFor' in fields)) throw new Error('Este PDF não está no padrão de ficha Tormenta20 (Fichas de Nimb) ou não tem campos preenchíveis.');
  const extra = [];
  for (let p = 4; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    let txt = '', lastY = null;
    tc.items.forEach(it => {
      const y = it.transform ? Math.round(it.transform[5]) : null;
      if (lastY !== null && y !== lastY) txt += '\n';
      txt += it.str; lastY = y;
      if (it.hasEOL) { txt += '\n'; lastY = null; }
    });
    extra.push(txt);
  }
  return t20FromFields(fields, extra);
}

</script>
<script>
// =====================================================================
//  CAMADA DE DADOS
//  Protótipo: tudo fica no armazenamento local do navegador.
//  Para o Supabase, cada coleção abaixo vira uma tabela com o mesmo nome
//  e os mesmos campos (users → auth.users + profiles).
// =====================================================================
const KEY = 'quadro_missoes_v2';

let mem = null;
const DB = {
  d: null,
  load() {
    if (CLOUD) { this.d = emptyData(); return; }
    try { const raw = localStorage.getItem(KEY); if (raw) { this.d = JSON.parse(raw); if (!this.d.maps) { seedMaps(this.d); this.save(); } if (!this.d.routes) this.d.routes = []; return; } } catch (e) {}
    this.d = mem || seed(); this.save();
  },
  save() { if (CLOUD) { scheduleSync(); return true; } try { localStorage.setItem(KEY, JSON.stringify(this.d)); return true; } catch (e) { mem = this.d; return false; } },
  reset() { try { localStorage.removeItem(KEY); } catch (e) {} mem = null; this.d = seed(); this.save(); },
  user(id) { return this.d.users.find(u => u.id === id); },
  camp(id) { return this.d.campaigns.find(c => c.id === id); },
  membership(cid, userId) { return this.d.members.find(m => m.campaign_id === cid && m.user_id === userId); },
  role(cid, userId) { const m = this.membership(cid, userId); return m && m.status === 'active' ? m.role : null; },
  members(cid, status = 'active') { return this.d.members.filter(m => m.campaign_id === cid && m.status === status); },
  missions(cid) { return this.d.missions.filter(q => q.campaign_id === cid).sort((a, b) => a.number - b.number); },
  checks(qid) { return this.d.checks.filter(c => c.mission_id === qid); },
  note(qid, userId) { return this.d.notes.find(n => n.mission_id === qid && n.user_id === userId); },
  sheetsOf(cid, userId) { return this.d.sheets.filter(s => s.campaign_id === cid && s.user_id === userId && !s.npc); },
  sheetOf(cid, userId) { const l = this.sheetsOf(cid, userId); return l.find(s => s.main) || l[0]; },
  sheet(id) { return this.d.sheets.find(s => s.id === id); },
};

function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'agora'; if (s < 3600) return `há ${Math.floor(s / 60)} min`; if (s < 86400) return `há ${Math.floor(s / 3600)} h`;
  return `há ${Math.floor(s / 86400)} d`;
}
function genCode(name) {
  const base = (name || 'CAMP').normalize('NFD').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 4).padEnd(4, 'X');
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c; do { c = base + '-' + Array.from({ length: 3 }, () => chars[Math.floor(Math.random() * chars.length)]).join(''); } while (DB.d.campaigns.some(x => x.code === c));
  return c;
}
let toastT;
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400);
}
async function copyText(txt, msg = 'Copiado!') {
  try { await navigator.clipboard.writeText(txt); toast(msg); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (_) {}
    ta.remove(); toast(ok ? msg : 'Não foi possível copiar automaticamente.');
  }
}

  confirmCb = onOk;
}

const omniMark = (cls = '', w = 92) => `<svg class="omark ${cls}" viewBox="-160 -160 320 320" width="${w}" height="${w}" aria-hidden="true"><path fill="#f5f4f6" fill-rule="evenodd" d="${OMNI_RING}"/><path class="star" fill="#7d27f1" d="${OMNI_STAR}"/></svg>`;
const THEMES = {
  medieval: { name: 'Medieval', desc: 'Pergaminho, madeira e cera', sign: 'Quadro de Missões', color: '#d8a95e', meta: '#15110e' },
  ciberpunk: { name: 'Ciberpunk', desc: 'Neon, grade e contratos', sign: 'Contratos', color: '#00e5ff', meta: '#05070d' },
  steampunk: { name: 'Steampunk', desc: 'Latão, cobre e engrenagens', sign: 'Quadro de Missões', color: '#d6a24a', meta: '#130f0a' },
  modern: { name: 'Modern', desc: 'Claro, limpo e direto', sign: 'Missões', color: '#2f6bff', meta: '#f3f4f7' },
  omni: { name: 'Omni', desc: 'O visual do Omni RP', sign: 'Missões', color: '#8b3dff', meta: '#07050c' },
};
const campTheme = c => (c && THEMES[c.theme]) ? c.theme : 'medieval';
let curTheme = null;
function applyTheme() {
  const inCamp = S.user && S.view === 'campaign' && camp();
  const th = inCamp ? campTheme(camp()) : 'omni';
  const cls = 'th-' + th + (inCamp ? ' incamp' : ' shell');
  if (document.body.className !== cls) {
    const changed = curTheme !== null && curTheme !== cls;
    document.body.className = cls; curTheme = cls;
    const mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.content = THEMES[th].meta;
    $('#deco').innerHTML = th === 'steampunk' ? '<i class="gear g1"></i><i class="gear g2"></i><i class="gear g3"></i><i class="gear g4"></i>' : '';
    if (changed) { const a = $('#app'); a.classList.remove('swap'); void a.offsetWidth; a.classList.add('swap'); }
  }
}
function brandHero(sub) {
  return `<div class="brandhero"><div class="mk"><div class="halo"></div>${omniMark('', 92)}</div><img class="wm" src="${WORDMARK}" alt="Omni RP"><div class="tagline">${sub || 'Gerenciador de campanhas de RPG'}</div></div>`;
}
// ---------- introdução animada ----------
// Enquanto a animação roda, o app não monta telas (render espera), para não travar os quadros.
function playIntro() {
  if (window.__introDone) return; window.__introDone = true;
  window.__introHold = true;
  const el = document.createElement('div'); el.id = 'intro'; el.className = 'pre';
  const sparks = Array.from({ length: 10 }, (_, i) => { const a = i / 10 * Math.PI * 2, r = 70 + (i % 3) * 22; return `<i class="spark" style="--sx:${(Math.cos(a) * r).toFixed(1)}px;--sy:${(Math.sin(a) * r).toFixed(1)}px;animation-delay:${(1 + (i % 4) * .04).toFixed(2)}s"></i>`; }).join('');
  el.innerHTML = `<div class="stage"><div class="glow"></div>${sparks}
    <div class="iwmwrap"><div class="iwmin"><img class="iwm" src="${WORDMARK}" alt=""></div></div>
    <div class="imark"><svg class="iring" viewBox="-160 -160 320 320" aria-hidden="true"><path fill="#f5f4f6" fill-rule="evenodd" d="${OMNI_RING}"/></svg>
      <svg class="istar" viewBox="-160 -160 320 320" aria-hidden="true"><path fill="#7d27f1" d="${OMNI_STAR}"/></svg></div></div>
    <div class="iline"></div><div class="itag">Campanhas de RPG</div><div class="skip">toque para pular</div>`;
  document.body.appendChild(el);
  const W = el.querySelector('.stage').clientWidth, mk = el.querySelector('.imark');
  mk.style.setProperty('--mx', (-(0.5 - 0.1156) * W).toFixed(1) + 'px');
  mk.style.setProperty('--ms', (0.212 * W / (120 * 302 / 320)).toFixed(3));
  let gone = false, released = false, timers = [];
  const release = () => { if (released) return; released = true; window.__introHold = false; if (window.__introPending) { window.__introPending = false; render(); } };
  const end = () => { if (gone) return; gone = true; release(); el.classList.add('out'); timers.forEach(clearTimeout); setTimeout(() => el.remove(), 550); };
  el.addEventListener('click', end);
  // só começa depois que o logotipo está decodificado e a tela já pintou
  const img = el.querySelector('.iwm');
  const go = () => requestAnimationFrame(() => requestAnimationFrame(() => {
    if (gone) return;
    el.classList.remove('pre'); window.__st = performance.now();
    timers.push(setTimeout(release, 3150));   // monta o app no momento em que tudo está parado
    timers.push(setTimeout(end, 3700));
  }));
  Promise.race([img.decode ? img.decode().catch(() => {}) : Promise.resolve(), new Promise(r => setTimeout(r, 600))]).then(go);
}
const S = { user: null, view: 'login', cid: null, tab: 'missoes', filter: 'todas', search: '', authMode: 'login', onlyTrained: false };
let M = null; // modal atual
function me() { return DB.user(S.user); }
function camp() { return DB.camp(S.cid); }
function isMaster() { return DB.role(S.cid, S.user) === 'master'; }

function setSession(id) { S.user = id; try { id ? localStorage.setItem(KEY + '_s', id) : localStorage.removeItem(KEY + '_s'); } catch (e) {} }

function render() {
  if (window.__introHold) { window.__introPending = true; return; }
  const app = $('#app');
  if (!S.user || !me()) { S.view = 'login'; applyTheme(); app.innerHTML = viewLogin(); return; }
  if (S.view === 'campaign' && (!camp() || !DB.role(S.cid, S.user))) S.view = 'home';
  applyTheme();
  app.innerHTML = S.view === 'campaign' ? viewCampaign() : viewHome();
  fitBoard(); initMap();
}
function openModal(m) { const fresh = !M; M = m; renderModal(fresh); }
function closeModal() { M = null; $('#modal').innerHTML = ''; }
function renderModal(fresh) {
  if (!M) return closeModal();
  const prevScroll = $('#modal .modal')?.scrollTop || 0;
  const fn = MODALS[M.kind]; if (!fn) return;
  $('#modal').innerHTML = `<div class="overlay${fresh ? ' anim' : ''}" data-act="overlay"><div class="modal" role="dialog">${fn()}</div></div>`;
  const md = $('#modal .modal'); if (md && M.keepScroll) md.scrollTop = prevScroll; M.keepScroll = false;
}
function refreshModal() { if (M) { M.keepScroll = true; renderModal(); } }
const mhead = (title, back) => `<div class="grab"></div><div class="mhead">${back ? `<button class="iconbtn" data-act="${back}">‹</button>` : ''}<h2>${title}</h2><button class="iconbtn" data-act="modal-close">✕</button></div>`;

// ---------- Missões: quadro com cartazes arrastáveis ----------
const BW = 422;                      // largura lógica interna do quadro (mesma disposição em todo aparelho)
const FINISHED = ['concluida', 'falhou'];
const POSTER = { frame: [192, 258], wanted: [192, 270], torn: [190, 228], note: [180, 206] };
const CAT_STYLE = {
  'Caçada': ['wanted', 'Procura-se', '☠'], 'Combate': ['frame', 'Recompensa'], 'Escolta': ['torn', 'Precisa-se de ajuda'],
  'Resgate': ['torn', 'Socorro'], 'Social': ['note', 'Atenção!'], 'Entrega': ['note', 'Aviso'],
  'Investigação': ['torn', 'Investigação'], 'Exploração': ['frame', 'Chamado à aventura'],

const hashStr = s => { let h = 7; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); };
const SHAPES = { auto: 'Automático', frame: 'Moldura', wanted: 'Procura-se', torn: 'Rasgado', note: 'Bilhete' };
const SHAPE_HEAD = { frame: 'Recompensa', wanted: 'Procura-se', torn: 'Aviso', note: 'Atenção!' };
const PAPERS = { auto: ['Pela situação', ''], pergaminho: ['Pergaminho', '#efe3c4'], sepia: ['Sépia', '#d6b98a'], cinza: ['Cinza', '#c9c3b8'], azul: ['Azulado', '#bccbd4'], verde: ['Musgo', '#c1d0a6'], vermelho: ['Rubro', '#e1ae9f'], roxo: ['Arcano', '#cdb9d9'], dourado: ['Dourado', '#ecd08a'], noite: ['Noite', '#3a3330'] };
const FX = { sujeira: 'Sujeira', cafe: 'Mancha de café', queimado: 'Queimado', dobras: 'Dobras', sangue: 'Respingos', velho: 'Envelhecido', brilho: 'Brilho da raridade' };
const SEALS = { auto: 'Automático', none: 'Sem lacre', red: 'Vermelho', black: 'Preto', gold: 'Dourado', green: 'Verde' };
const ICONS = ['☠', '⚔', '🐉', '👁', '🗝', '🕯', '🐺', '💀', '👑', '🔥', '🌙', '🧪'];
const mstyle = q => q.style || {};
const posterStyle = q => {
  const st = mstyle(q), base = CAT_STYLE[q.category] || ['torn', q.category || 'Missão', '☠'];
  const shape = st.shape && st.shape !== 'auto' ? st.shape : base[0];
  const head = st.head || (st.shape && st.shape !== 'auto' ? SHAPE_HEAD[shape] : base[1]);
  return [shape, head, st.icon || base[2] || '☠'];
};
const posterSize = q => POSTER[posterStyle(q)[0]];

// Missões no quadro (não finalizadas). Mestre também vê as ocultas.
function boardMissions() {
  const master = isMaster();
  return DB.missions(S.cid).filter(q => !FINISHED.includes(q.status) && (master || q.visible));
}
function historyMissions() {
  const master = isMaster();
  return DB.missions(S.cid).filter(q => FINISHED.includes(q.status) && (master || q.visible))
    .sort((a, b) => (b.finished_at || '').localeCompare(a.finished_at || ''));
}
// Posições: as já salvas ficam; as novas entram em duas colunas abaixo das existentes
function layoutBoard() {
  const all = DB.missions(S.cid).filter(q => !FINISHED.includes(q.status));
  const pos = {};
  let start = 66;
  all.forEach(q => { if (q.pos) { pos[q.id] = q.pos; start = Math.max(start, q.pos.y + posterSize(q)[1] + 22); } });
  const cols = [start, start];
  all.filter(q => !q.pos).sort((a, b) => (b.visible - a.visible) || a.number - b.number).forEach(q => {
    const [w, h] = posterSize(q), c = cols[0] <= cols[1] ? 0 : 1, j = hashStr(q.id) % 9;
    pos[q.id] = { x: c === 0 ? 4 + j : BW - w - 4 - j, y: cols[c] + (hashStr(q.id + 'y') % 14) };
    cols[c] += h + 24;
  });
  return pos;
}
function freezeBoard() { const pos = layoutBoard(); DB.missions(S.cid).forEach(q => { if (!q.pos && pos[q.id]) q.pos = { ...pos[q.id] }; }); }
function matchesFilter(q) {
  if (S.filter === 'ocultas' && q.visible) return false;
  if ((S.filter === 'disponivel' || S.filter === 'andamento') && q.status !== S.filter) return false;
  const s = S.search.trim().toLowerCase();
  return !s || [q.title, q.client, q.location, q.category, q.rarity, q.description, q.reward].join(' ').toLowerCase().includes(s);
}
function posterHtml(q, p) {
  const [v, head, icon] = posterStyle(q), [w, h] = POSTER[v];
  const rot = ((hashStr(q.id) % 9) - 4) * 0.55;
  const done = new Set(DB.checks(q.id).map(c => c.item_id)), total = q.checklist.length, n = q.checklist.filter(i => done.has(i.id)).length;
  const fixings = v === 'torn' || v === 'note' ? '<i class="nail l"></i><i class="nail r"></i>' : '<i class="pin"></i>';
  const st = mstyle(q), paper = PAPERS[st.paper] && st.paper !== 'auto' ? PAPERS[st.paper][1] : '';
  const seal = st.seal && st.seal !== 'auto' ? st.seal : (v === 'frame' || v === 'wanted' ? 'red' : 'none');
  const fx = (st.fx || []).map(f => `<i class="fx fx-${f}"></i>`).join('');
  const preview = p.preview;
  return `<article class="poster v-${v} s-${q.status} ${st.paper === 'noite' ? 'p-dark' : ''} ${(st.fx || []).includes('brilho') ? 'glow' : ''} ${q.visible ? '' : 'is-hidden'} ${!preview && !matchesFilter(q) ? 'dim' : ''}" ${preview ? '' : `data-poster="${q.id}"`} style="${preview ? 'position:relative;' : `left:${p.x}px;top:${p.y}px;`}width:${w}px;height:${h}px;--rot:${preview ? 0 : rot}deg;z-index:${q.z || 1};--rar:${RAR_COLOR[q.rarity] || '#7a6a54'}${paper ? `;--pp:${paper}` : ''}">
    <div class="paper">${fx}${fixings}${seal !== 'none' ? `<i class="seal seal-${seal}"></i>` : ''}
      <div class="ph">${esc(head)}</div>
      ${v === 'wanted' ? `<div class="portrait">${icon}</div>` : ''}
      <div class="pt">${esc(q.title || 'Missão sem título')}</div>
      <div class="pm">${esc(q.location || 'Local a definir')}${q.visible ? '' : ' · <b>oculta</b>'}</div>
      ${q.description ? `<div class="pd">${esc(q.description)}</div>` : ''}
      ${total ? `<div class="pprog"><i style="width:${n / total * 100}%"></i></div>` : ''}
      <div class="pfoot"><span class="pr">${esc(q.reward || '—')}</span><span class="ps ps-${q.status}">${total ? n + '/' + total : STATUS[q.status]}</span></div>
    </div></article>`;
}
function tabMissions() {
  const master = isMaster(), list = boardMissions(), hist = historyMissions();
  const cnt = k => k === 'todas' ? list.length : k === 'ocultas' ? list.filter(q => !q.visible).length : list.filter(q => q.status === k).length;
  const chips = [['todas', 'Todas'], ['disponivel', 'Disponíveis', 'var(--s-disp)'], ['andamento', 'Em andamento', 'var(--s-and)']];

      <div class="grow"><div class="t cinzel" style="color:var(--accent)">Histórico</div><div class="small muted">${hist.length ? `${hist.filter(q => q.status === 'concluida').length} concluídas · ${hist.filter(q => q.status === 'falhou').length} fracassos` : 'Missões finalizadas ficam guardadas aqui'}</div></div>

let boardScale = 1;
function fitBoard() {
  const wrap = $('#boardWrap'), board = $('#board'); if (!wrap || !board) return;
  const W = wrap.clientWidth, full = BW + 18;
  boardScale = Math.min(W / full, 1.55);
  board.style.transform = `scale(${boardScale})`;
  board.style.left = Math.max(0, (W - full * boardScale) / 2) + 'px';
  wrap.style.height = (Number(board.dataset.h) + 18) * boardScale + 'px';
}
window.addEventListener('resize', fitBoard);
function applyBoardFilter() { document.querySelectorAll('.poster').forEach(el => { const q = DB.d.missions.find(x => x.id === el.dataset.poster); el.classList.toggle('dim', !!q && !matchesFilter(q)); }); }

// Arrastar: mouse arrasta direto; no toque, segure ~0,3 s e arraste (rolar a tela continua funcionando)
let drag = null;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('.poster'); if (!el || (e.pointerType === 'mouse' && e.button !== 0)) return;
  drag = { el, id: el.dataset.poster, sx: e.clientX, sy: e.clientY, ox: parseFloat(el.style.left), oy: parseFloat(el.style.top), active: false, moved: false, pid: e.pointerId, type: e.pointerType };
  if (e.pointerType !== 'mouse') drag.timer = setTimeout(startDrag, 280);
});
function startDrag() {
  if (!drag) return; drag.active = true; drag.el.classList.add('dragging');
  try { drag.el.setPointerCapture(drag.pid); } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
}
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.active) {
    if (Math.hypot(dx, dy) < 7) return;
    if (drag.type === 'mouse') startDrag(); else { clearTimeout(drag.timer); drag = null; return; }
  }
  drag.moved = true;
  const w = drag.el.offsetWidth, h = drag.el.offsetHeight, board = $('#board');
  const x = Math.max(-6, Math.min(BW - w + 6, drag.ox + dx / boardScale));
  const y = Math.max(54, drag.oy + dy / boardScale);
  drag.el.style.left = x + 'px'; drag.el.style.top = y + 'px';
  const need = y + h + 36; if (need > Number(board.dataset.h)) { board.dataset.h = need; board.style.height = need + 'px'; fitBoard(); }
});
function endDrag(cancel) {
  if (!drag) return; clearTimeout(drag.timer); const d = drag; drag = null;
  if (d.active) {
    d.el.classList.remove('dragging');
    if (d.moved) {
      freezeBoard();
      const q = DB.d.missions.find(x => x.id === d.id), z = Math.max(1, ...DB.missions(S.cid).map(m => m.z || 1)) + 1;
      q.pos = { x: Math.round(parseFloat(d.el.style.left)), y: Math.round(parseFloat(d.el.style.top)) }; q.z = z; d.el.style.zIndex = z;
      DB.save();
    }
  } else if (!cancel) openModal({ kind: 'mission', id: d.id, tab: 'detalhes' });
}
document.addEventListener('pointerup', () => endDrag(false));
document.addEventListener('pointercancel', () => endDrag(true));
document.addEventListener('touchmove', e => { if (drag && drag.active) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', e => { if (e.target.closest('.poster')) e.preventDefault(); });

function parsePowers(txt) {
  const items = []; let cur = null;
  String(txt || '').split('\n').forEach(line => {
    const m = line.match(/^\s*[-•]\s*([^:]{2,80}?)\s*(\([^)]*\))?\s*:\s*(.*)$/);
    if (m) { cur = { name: m[1].trim(), sub: (m[2] || '').replace(/[()]/g, ''), text: m[3] }; items.push(cur); }
    else if (cur) cur.text += '\n' + line; else if (line.trim()) { cur = { name: line.trim().slice(0, 60), sub: '', text: line }; items.push(cur); }
  });
  return items;
}
function customView(sh, canEdit) {
  const c = DB.camp(sh.campaign_id), tpl = c.template || { sections: [] }, v = sh.data.values || (sh.data.values = {});
  if (!tpl.sections.length) return `<div class="panel empty">O mestre ainda não montou o modelo de ficha.</div>`;
  const dis = canEdit ? '' : 'disabled';
  const fld = f => {
    const val = v[f.id];
    const a = `data-cf="${f.id}" data-sid="${sh.id}" ${dis}`;
    switch (f.type) {
      case 'textarea': return `<label class="field"><span>${esc(f.label)}</span><textarea class="in" ${a}>${esc(val || '')}</textarea></label>`;
      case 'number': return `<label class="field"><span>${esc(f.label)}</span><input class="in" type="number" inputmode="numeric" ${a} value="${esc(val ?? '')}"></label>`;
      case 'stat': return `<label class="attr cstat"><div class="l">${esc(f.label)}</div><input class="in" type="number" inputmode="numeric" ${a} value="${esc(val ?? 0)}" style="border:0;background:none;padding:4px"></label>`;
      case 'bar': { const b = val || { atual: 0, max: 0 }; return `<div class="res"><div class="top"><span class="lab">${esc(f.label)}</span><span class="row" style="gap:4px"><input class="in" style="width:70px;padding:6px;text-align:center" type="number" ${a} data-part="atual" value="${esc(b.atual)}"> / <input class="in" style="width:70px;padding:6px;text-align:center" type="number" ${a} data-part="max" value="${esc(b.max)}"></span></div><div class="bar gen"><i style="width:${b.max ? Math.max(0, Math.min(100, b.atual / b.max * 100)) : 0}%"></i></div></div>`; }
      case 'check': return `<label class="item" style="cursor:pointer"><span class="grow t">${esc(f.label)}</span><input type="checkbox" ${a} ${val ? 'checked' : ''} style="width:22px;height:22px;accent-color:var(--accent)"></label>`;
      case 'select': return `<label class="field"><span>${esc(f.label)}</span><select class="in" ${a}><option value="">—</option>${String(f.options || '').split(',').map(o => o.trim()).filter(Boolean).map(o => `<option ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></label>`;
      default: return `<label class="field"><span>${esc(f.label)}</span><input class="in" ${a} value="${esc(val || '')}"></label>`;
    }
  };
  return `<div class="sheet-head parch"><div class="small muted cinzel">FICHA · ${esc(c.name.toUpperCase())}</div><h2>${esc(sheetName(sh))}</h2></div>
    ${tpl.sections.map(s => {
      const stats = s.fields.filter(f => f.type === 'stat'), rest = s.fields.filter(f => f.type !== 'stat');
      return `<div class="panel"><h3>${esc(s.title)}</h3>${stats.length ? `<div class="attrs" style="grid-template-columns:repeat(${Math.min(stats.length, 6)},1fr);margin-top:0">${stats.map(fld).join('')}</div>` : ''}${rest.map(fld).join('')}</div>`;
    }).join('')}
    ${invButton(sh)}
    ${canEdit ? '<div class="saved" id="sheetSaved" style="text-align:center;margin:-6px 0 10px"></div>' : ''}`;
}
// ---------- Inventário ----------
function invOf(sh) {
  const d = sh.data;
  if (!Array.isArray(d.inventario)) {
    const eqNames = [...(d.ataques || []), ...(d.armaduras || [])].map(a => (a.nome || '').toLowerCase()).filter(Boolean);
    d.inventario = (d.equipamento || []).map(line => {
      const m = line.match(/\((\d+(?:[.,]\d+)?)\s*espa[çc]os?\)/i);
      const nome = line.replace(/\s*\(\d+(?:[.,]\d+)?\s*espa[çc]os?\)\s*/i, ' ').trim();
      return { id: uid('it'), nome, qtd: 1, espacos: m ? Number(m[1].replace(',', '.')) : '', equipado: eqNames.some(n => nome.toLowerCase().startsWith(n)) };
    });
  }
  return d.inventario;
}
const invLoad = items => Math.round(items.reduce((s, i) => s + (Number(i.espacos) || 0) * (Number(i.qtd) || 1), 0) * 10) / 10;
function invButton(sh) {
  const it = invOf(sh), eq = it.filter(i => i.equipado), max = sh.system === 't20' ? sh.data.carga?.maxima : '';
  return `<div class="panel inv-btn" data-act="inv-open" data-id="${sh.id}"><div class="row"><span style="font-size:26px">🎒</span><div class="grow"><div class="cinzel" style="color:var(--accent)">Inventário</div><div class="small muted">${it.length} ${it.length === 1 ? 'item' : 'itens'} · ${eq.length} equipado${eq.length === 1 ? '' : 's'}${max ? ` · carga ${invLoad(it)}/${esc(max)}` : ''}${sh.system === 't20' && sh.data.dinheiro?.ts ? ` · T$ ${esc(sh.data.dinheiro.ts)}` : ''}</div></div><span class="muted" style="font-size:24px">›</span></div>

}

function newSheet(userId) {
  const c = camp(), npc = userId === 'npc';
  const sh = { id: uid('sh_'), campaign_id: c.id, user_id: npc ? null : userId, npc, system: c.system, data: c.system === 't20' ? t20blank(npc ? 'Novo NPC' : (DB.user(userId)?.name ? '' : '')) : { values: {} }, updated_at: now() };
  DB.d.sheets.push(sh); DB.save(); return sh;
}
let pendingImport = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Falha ao carregar ' + src)); document.head.appendChild(s); }); }
async function ensurePdfJs() {
  if (window.pdfjsLib && window.pdfjsWorker) return;
  const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  if (!window.pdfjsLib) await loadScript(base + 'pdf.min.js');
  if (!window.pdfjsWorker) await loadScript(base + 'pdf.worker.min.js'); // roda o leitor na própria página
  try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js'; } catch (e) {}
}
function downloadFile(name, text) {
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('Download iniciado (se o navegador permitir).'); }
  catch (e) { toast('Download bloqueado aqui. Use “Copiar”.'); }
}
function importMissions(obj) {
  const list = Array.isArray(obj) ? obj : obj?.missions;
  if (!Array.isArray(list) || !list.length) throw new Error('Nenhuma missão encontrada nesse JSON.');
  let n = Math.max(0, ...DB.missions(S.cid).map(q => q.number));
  list.forEach(x => {
    DB.d.missions.push({
      id: uid('q_'), campaign_id: S.cid, number: ++n, title: String(x.title || x.titulo || 'Missão'), client: String(x.client || x.contratante || ''), location: String(x.location || x.local || ''),
      category: CATEGORIES.includes(x.category) ? x.category : (x.category || 'Investigação'), rarity: RARITIES.includes(x.rarity) ? x.rarity : 'Comum',
      status: STATUS[x.status] ? x.status : 'disponivel', reward: String(x.reward || x.recompensa || ''), description: String(x.description || x.descricao || ''),
      visible: x.visible !== false, checklist: (x.checklist || []).map((i, k) => ({ id: 'i' + k + uid(), text: String(i.text ?? i) })), created_at: now()
    });
  });
  DB.save(); return list.length;

function styleEditor(d) {
  const st = d.style || (d.style = {}), [shape] = posterStyle(d);
  const opt = (name, obj, cur) => Object.entries(obj).map(([k, l]) => `<label class="segopt"><input type="radio" name="${name}" value="${k}" ${(cur || 'auto') === k ? 'checked' : ''} data-sty><span>${Array.isArray(l) ? l[0] : l}</span></label>`).join('');
  return `<details class="pw stylebox" ${M.styleOpen ? 'open' : ''} data-act="style-toggle"><summary>🎨 Aparência do cartaz <span class="sub">formato, cor e efeitos</span></summary>
    <div class="spreview" id="posterPreview">${posterPreviewHtml(d)}</div>
    <div class="field"><span>Formato</span><div class="seg wrapseg" style="margin:0">${opt('st_shape', SHAPES, st.shape)}</div><div class="small muted" style="margin-top:4px">Automático: pela categoria (${esc(d.category)} → ${SHAPES[(CAT_STYLE[d.category] || ['torn'])[0]]}).</div></div>
    <div class="field"><span>Cor do papel</span><div class="swatches">${Object.entries(PAPERS).map(([k, [l, c]]) => `<label class="swatch" title="${l}"><input type="radio" name="st_paper" value="${k}" ${(st.paper || 'auto') === k ? 'checked' : ''} data-sty><span style="${c ? `background:${c}` : 'background:conic-gradient(var(--s-disp) 0 33%,var(--s-and) 0 66%,var(--s-conc) 0)'}"></span><em>${l}</em></label>`).join('')}</div></div>
    <div class="field"><span>Efeitos</span><div class="condgrid">${Object.entries(FX).map(([k, l]) => `<label class="fxopt"><input type="checkbox" name="st_fx" value="${k}" ${(st.fx || []).includes(k) ? 'checked' : ''} data-sty><span>${l}</span></label>`).join('')}</div></div>
    <div class="field"><span>Lacre</span><div class="seg wrapseg" style="margin:0">${opt('st_seal', SEALS, st.seal)}</div></div>
    <div class="grid2"><label class="field"><span>Título do cartaz</span><input class="in" name="st_head" maxlength="24" value="${esc(st.head || '')}" placeholder="${esc(posterStyle({ ...d, style: { ...st, head: '' } })[1])}" data-sty></label>
    <div class="field"><span>Ícone (Procura-se)</span><div class="row wrap-r" style="gap:4px">${ICONS.map(i => `<label class="icopt"><input type="radio" name="st_icon" value="${i}" ${st.icon === i ? 'checked' : ''} data-sty><span>${i}</span></label>`).join('')}</div></div></div>
    <div class="row"><button type="button" class="btn sm ghost" data-act="style-random">🎲 Surpreenda-me</button><button type="button" class="btn sm ghost" data-act="style-reset">Restaurar automático</button></div>
  </details>`;
}

const T20_CONDS = ['Abalado', 'Agarrado', 'Alquebrado', 'Apavorado', 'Atordoado', 'Caído', 'Cego', 'Confuso', 'Debilitado', 'Desprevenido', 'Enjoado', 'Enredado', 'Envenenado', 'Esmorecido', 'Exausto', 'Fascinado', 'Fatigado', 'Fraco', 'Frustrado', 'Imóvel', 'Inconsciente', 'Indefeso', 'Lento', 'Ofuscado', 'Paralisado', 'Pasmo', 'Petrificado', 'Sangrando', 'Surdo', 'Surpreendido', 'Vulnerável'];
const t20TreinoBonus = lvl => lvl >= 15 ? 6 : lvl >= 7 ? 4 : 2;
function t20Suggest(d) {
  const c = T20_CLASSES[d.classe]; if (!c) return null;
  const con = Number(d.atributos.CON) || 0, n = Math.max(1, Number(d.nivel) || 1);
  return { pv: Math.max(1, c[0] + con + (n - 1) * (c[1] + con)), pm: c[2] * n };
}
const sgnExpr = n => (Number(n) < 0 ? '' : '+') + Number(n || 0);

// ---------- Rolagens ----------
const ROLLS = [];
function rollDice(expr) {
  const terms = String(expr).replace(/\s/g, '').replace(/−/g, '-').match(/[+-]?[^+-]+/g) || [];
  let total = 0, d20 = null; const parts = [];
  for (const t of terms) {
    const sign = t[0] === '-' ? -1 : 1, body = t.replace(/^[+-]/, ''), m = body.match(/^(\d*)d(\d+)$/i);
    if (m) {
      const n = Math.min(50, Math.max(1, Number(m[1] || 1))), f = Math.max(2, Number(m[2]));
      const rs = Array.from({ length: n }, () => 1 + Math.floor(Math.random() * f));
      if (f === 20 && n === 1 && d20 === null) d20 = rs[0];
      total += sign * rs.reduce((a, b) => a + b, 0); parts.push(`${sign < 0 ? '−' : parts.length ? '+' : ''}${n}d${f} [${rs.join(', ')}]`);
    } else if (/^\d+$/.test(body)) { total += sign * Number(body); parts.push((sign < 0 ? '− ' : '+ ') + body); }
  }
  return { total, parts, d20, valid: parts.length > 0 };
}
function doRoll(label, expr, critMin) {
  const r = rollDice(expr); if (!r.valid) { toast('Expressão de dados inválida'); return null; }
  const e = { id: uid('r'), label, expr, ...r, who: me()?.name || '', at: Date.now(), crit: !!critMin && r.d20 !== null && r.d20 >= critMin, fumble: r.d20 === 1 };
  ROLLS.unshift(e); ROLLS.length = Math.min(ROLLS.length, 40); showRoll(e); if (M && M.kind === 'dice') refreshModal(); return e;
}
function showRoll(e) {
  let el = $('#rollbar'); if (!el) { el = document.createElement('div'); el.id = 'rollbar'; document.body.appendChild(el); }
  el.innerHTML = `<div class="rb-in" data-act="dice-open"><span class="rb-ic">🎲</span><div class="grow" style="min-width:0"><div class="rb-l">${esc(e.label)}${e.crit ? ' · <b class="rb-crit">CRÍTICO!</b>' : ''}${e.fumble ? ' · <b class="rb-fail">1 natural</b>' : ''}</div><div class="rb-p">${esc(e.parts.join(' '))}</div></div><div class="rb-total ${e.crit ? 'crit' : ''} ${e.fumble ? 'fumble' : ''}">${e.total}</div></div>`;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  clearTimeout(showRoll.t); showRoll.t = setTimeout(() => el.classList.remove('show'), 5000);
}
function critOf(str) { const m = String(str || '').match(/(\d{1,2})/); const n = m ? Number(m[1]) : 20; return n >= 2 && n <= 20 ? n : 20; }

  if (!sheets.length) return '';
  const bar = (a, b, cls) => `<div class="bar ${cls}" style="margin:4px 0 0;height:6px"><i style="width:${b ? Math.max(0, Math.min(100, a / b * 100)) : 0}%"></i></div>`;
  return `<div class="panel"><h3>👥 Visão do grupo</h3><div class="pgrid">${sheets.map(sh => {

}

const COLLS = ['users', 'campaigns', 'members', 'missions', 'checks', 'notes', 'sheets', 'maps', 'markers', 'regions', 'routes'];
const docId = (c, x) => x.id || (c === 'checks' ? x.mission_id + ':' + x.item_id : '');
let snap = {};
function takeSnap() { snap = {}; COLLS.forEach(c => { snap[c] = new Map((DB.d[c] || []).filter(x => docId(c, x)).map(x => [docId(c, x), JSON.stringify(x)])); }); }
function emptyData() { const d = {}; COLLS.forEach(c => { d[c] = []; }); return d; }
function setCloudStatus(st) { const el = $('#cloudDot'); if (el) { el.className = 'cdot ' + st; el.title = { ok: 'Sincronizado', sync: 'Salvando…', erro: 'Erro ao salvar' }[st] || ''; } }

let syncT = null, syncing = false, syncAgain = false;
function scheduleSync() { if (!CLOUD || !sb || !S.user) return; setCloudStatus('sync'); clearTimeout(syncT); syncT = setTimeout(pushChanges, 350); }
async function pushChanges() {
  if (syncing) { syncAgain = true; return; }
  syncing = true;
  try {
    const ups = [], jsons = [], dels = [];
    COLLS.forEach(c => {
      const cur = new Map((DB.d[c] || []).filter(x => docId(c, x)).map(x => [docId(c, x), x])), old = snap[c] || new Map();
      cur.forEach((x, id) => { const j = JSON.stringify(x); if (old.get(id) !== j) { ups.push({ collection: c, id, data: x }); jsons.push([c, id, j]); } });
      old.forEach((_, id) => { if (!cur.has(id)) dels.push([c, id]); });
    });
    for (let i = 0; i < ups.length; i += 200) { const { error } = await sb.from('docs').upsert(ups.slice(i, i + 200)); if (error) throw error; }
    jsons.forEach(([c, id, j]) => { (snap[c] = snap[c] || new Map()).set(id, j); });
    for (const [c, id] of dels) { const { error } = await sb.from('docs').delete().eq('collection', c).eq('id', id); if (error) throw error; snap[c].delete(id); }
    setCloudStatus('ok');
  } catch (e) { console.error(e); setCloudStatus('erro'); toast('Não consegui salvar no servidor: ' + (e.message || e)); }
  syncing = false;
  if (syncAgain) { syncAgain = false; pushChanges(); }
}
async function cloudLoad() {
  const d = emptyData();
  for (let from = 0; ; from += 1000) {
    const { data, error } = await sb.from('docs').select('collection,id,data').range(from, from + 999);
    if (error) throw error;
    data.forEach(r => { if (d[r.collection]) d[r.collection].push(r.data); });
    if (data.length < 1000) break;
  }
  DB.d = d; takeSnap();
}

function cloudSubscribe() {
  sb.channel('docs-sync').on('postgres_changes', { event: '*', schema: 'public', table: 'docs' }, p => {
    const r = (p.new && p.new.collection) ? p.new : p.old; if (!r || !DB.d[r.collection]) return;
    const c = r.collection, id = r.id, arr = DB.d[c], i = arr.findIndex(x => docId(c, x) === id);
    if (p.eventType === 'DELETE') { if (i < 0) return; arr.splice(i, 1); snap[c] && snap[c].delete(id); }
    else {
      const x = p.new.data, j = JSON.stringify(x);
      if (snap[c] && snap[c].get(id) === j) return;
      if (i >= 0) arr[i] = x; else arr.push(x);
      (snap[c] = snap[c] || new Map()).set(id, j);
    }
    softRender();
  }).subscribe();
}

    c.code = genCode(c.name);
    if (c.system === 'custom') c.template = { sections: [{ id: uid('s'), title: 'Identidade', fields: [{ id: uid('f'), label: 'Nome do personagem', type: 'text' }, { id: uid('f'), label: 'Conceito', type: 'text' }] }, { id: uid('s'), title: 'Atributos', fields: [] }] };
    DB.d.campaigns.push(c); DB.d.members.push({ id: uid('m_'), campaign_id: c.id, user_id: S.user, role: 'master', status: 'active', created_at: now() });
    DB.save(); closeModal(); S.cid = c.id; S.view = 'campaign'; S.tab = c.system === 'custom' ? 'fichas' : 'jogadores'; render();
    toast('Campanha criada! Código: ' + c.code);
    if (c.system === 'custom') setTimeout(() => ACT['builder-open'](), 250);
  }
  if (f.id === 'joinForm') {
    const code = v('code').toUpperCase().replace(/\s/g, ''), err = $('#joinErr');
    const c = DB.d.campaigns.find(x => x.code.replace('-', '') === code.replace('-', ''));
    if (!c) return err.textContent = 'Nenhuma campanha com esse código.';
    const m = DB.membership(c.id, S.user);
    if (m?.status === 'active') return err.textContent = 'Você já está nessa campanha.';
    if (m?.status === 'pending') return err.textContent = 'Você já pediu para entrar. Aguarde o mestre.';
    if (m?.status === 'invited') { m.status = 'active'; DB.save(); closeModal(); render(); return toast('Você já tinha um convite — entrou em ' + c.name); }
    DB.d.members.push({ id: uid('m_'), campaign_id: c.id, user_id: S.user, role: 'player', status: 'pending', created_at: now() });
    DB.save(); closeModal(); render(); toast('Solicitação enviada ao mestre de ' + c.name);
  }
  if (f.id === 'inviteForm') {
    const email = v('email').toLowerCase(), err = $('#inviteErr'), u = DB.d.users.find(x => x.email === email);
    if (!u) return err.textContent = 'Nenhuma conta com esse e-mail. Peça para o jogador criar uma conta ou passe o código.';
    const m = DB.membership(S.cid, u.id);
    if (m?.status === 'active') return err.textContent = u.name + ' já está na campanha.';
    if (m?.status === 'invited') return err.textContent = 'Convite já enviado.';
    if (m?.status === 'pending') { m.status = 'active'; DB.save(); render(); return toast(u.name + ' tinha pedido para entrar — aprovado!'); }
    DB.d.members.push({ id: uid('m_'), campaign_id: S.cid, user_id: u.id, role: 'player', status: 'invited', created_at: now() });
    DB.save(); render(); toast('Convite enviado para ' + u.name);
  }
  if (f.id === 'missionForm') {
    syncDraft(); const d = M.draft;
    d.checklist = d.checklist.filter(i => i.text.trim()).map(i => ({ id: i.id || 'i' + uid(), text: i.text.trim() }));
    if (M.id) { const q = DB.d.missions.find(x => x.id === M.id); Object.assign(q, d); const ids = new Set(q.checklist.map(i => i.id)); DB.d.checks = DB.d.checks.filter(c => c.mission_id !== q.id || ids.has(c.item_id)); }
    else { const n = Math.max(0, ...DB.missions(S.cid).map(q => q.number)) + 1; DB.d.missions.push({ ...d, id: uid('q_'), campaign_id: S.cid, number: n, created_at: now() }); }
    DB.missions(S.cid).forEach(q => { if (FINISHED.includes(q.status)) { if (!q.finished_at) q.finished_at = now(); } else q.finished_at = null; });
    DB.save(); const wasEdit = !!M.id, id = M.id; render();
    if (wasEdit) openModal({ kind: 'mission', id, tab: 'detalhes' }); else closeModal();
    toast(wasEdit ? 'Missão atualizada' : d.visible ? 'Missão pregada no quadro!' : 'Missão salva como oculta');
  }
  if (f.id === 'checkAddForm') {
    const q = DB.d.missions.find(x => x.id === M.id); q.checklist.push({ id: 'i' + uid(), text: v('text') }); DB.save(); refreshModal(); render();
    setTimeout(() => $('#checkAddForm input')?.focus(), 30);
  }
  if (f.id === 'invAddForm') {
    const sh = DB.sheet(M.id), it = invOf(sh), esp = v('espacos');
    it.push({ id: uid('it'), nome: v('nome'), qtd: Math.max(1, Number(v('qtd')) || 1), espacos: esp === '' ? '' : Number(esp), nota: v('nota'), equipado: false });
    sh.updated_at = now(); DB.save(); refreshModal(); render(); toast('Item adicionado');
    setTimeout(() => $('#invAddForm [name=nome]')?.focus(), 30);
  }
  if (f.id === 'campForm') { const c = camp(); c.name = v('name'); c.description = v('description'); DB.save(); render(); toast('Campanha salva'); }
  if (f.id === 'sheetEditForm') {
    const sh = DB.sheet(M.id), d = sh.data, num = k => Number(fd.get(k)) || 0;
    Object.assign(d, { nome: v('nome'), jogador: v('jogador'), raca: v('raca'), origem: v('origem'), classe: v('classe'), nivel: Math.max(1, num('nivel')), divindade: v('divindade'), deslocamento: v('desloc'), proficiencias: v('proficiencias'), poderes: fd.get('poderes') || '', magias: fd.get('magias') || '' });
    T20_ATTRS.forEach(a => d.atributos[a] = num('at_' + a));
    const pvOld = d.pv.max, pmOld = d.pm.max;
    d.pv.max = num('pvmax'); d.pm.max = num('pmmax');
    if (d.pv.atual === pvOld || d.pv.atual > d.pv.max) d.pv.atual = d.pv.max;
    if (d.pm.atual === pmOld || d.pm.atual > d.pm.max) d.pm.atual = d.pm.max;
    d.defesa.total = num('defesa'); d.dinheiro.ts = v('ts');
    d.pericias.forEach((p, i) => { p.treinado = !!fd.get('sk_tr_' + i); p.treino = num('sk_t_' + i); p.outros = num('sk_o_' + i); });
    t20recalc(d); sh.updated_at = now(); DB.save(); render(); ACT['back-sheet'](); toast('Ficha salva');
  }
});
let noteT, sheetT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.closest && t.closest('#missionForm') && M && M.kind === 'missionEdit') { syncDraft(); const pv = $('#posterPreview'); if (pv) pv.innerHTML = posterPreviewHtml(M.draft); }
  if (t.id === 'searchIn') { S.search = t.value; applyBoardFilter(); }
  if (t.dataset.note) {
    clearTimeout(noteT); $('#noteSaved').textContent = 'Salvando…';
    noteT = setTimeout(() => {
      let n = DB.note(t.dataset.note, S.user);
      if (!n) { n = { id: uid('n_'), mission_id: t.dataset.note, user_id: S.user, text: '' }; DB.d.notes.push(n); }
      n.text = t.value; n.updated_at = now(); DB.save(); const s = $('#noteSaved'); if (s) s.textContent = '✓ Salvo';
    }, 450);
  }
  if (t.dataset.sheetnote) { clearTimeout(sheetT); sheetT = setTimeout(() => { const sh = DB.sheet(t.dataset.sheetnote); sh.data.anotacoes = t.value; sh.updated_at = now(); DB.save(); document.querySelectorAll('#sheetSaved').forEach(s => s.textContent = '✓ Salvo'); }, 450); }
  if (t.dataset.cf && t.type !== 'checkbox' && t.tagName !== 'SELECT') saveCustom(t, false);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.actChange === 'mission-status') { setStatus(DB.d.missions.find(x => x.id === t.dataset.id), t.value); refreshModal(); render(); }
  if (t.dataset.cf) saveCustom(t, true);
  if (t.dataset.bf && t.dataset.k === 'type') { syncBuilder(); refreshModal(); }
  if (t.id === 'pdfPick') { pickOpened = true; if (t.files[0]) handlePdf(t.files[0]); }
  if (t.id === 'jsonInput' && t.files[0]) { t.files[0].text().then(txt => { const p = $('#jsonPaste'); if (p) p.value = txt; ACT['json-import'](); }); }
});
let cfT;
function saveCustom(t, rerender) {
  const sh = DB.sheet(t.dataset.sid), v = sh.data.values || (sh.data.values = {}), id = t.dataset.cf;
  if (t.dataset.part) { v[id] = v[id] || { atual: 0, max: 0 }; v[id][t.dataset.part] = Number(t.value) || 0; }
  else if (t.type === 'checkbox') v[id] = t.checked;
  else if (t.type === 'number') v[id] = t.value === '' ? '' : Number(t.value);
  else v[id] = t.value;
  sh.updated_at = now();
  clearTimeout(cfT); cfT = setTimeout(() => { DB.save(); document.querySelectorAll('#sheetSaved').forEach(s => s.textContent = '✓ Salvo'); }, 300);
  if (rerender && (t.dataset.part || t.type === 'checkbox')) { DB.save(); if (M) refreshModal(); const y = window.scrollY; render(); window.scrollTo(0, y); }
}
async function handlePdf(file) {
  if (!M || M.kind !== 'pdfImport') return;
  const st = $('#pdfStatus'), say = (t, err) => { if (st) { st.textContent = t; st.style.color = err ? '#f19a8c' : ''; } };
  if (!/pdf$/i.test(file.type) && !/\.pdf$/i.test(file.name)) return say('Escolha um arquivo PDF.', true);
  say('Lendo ' + file.name + '…');
  try {
    await ensurePdfJs();
    const data = await t20ParsePdf(await file.arrayBuffer());
    openModal({ kind: 'importPreview', data, userId: M.userId, replace: M.replace });
  } catch (err) { console.error(err); say('Não consegui ler esse PDF: ' + err.message, true); }
}
function setStatus(q, status) {
  const was = FINISHED.includes(q.status); q.status = status;
  if (FINISHED.includes(status) && !was) { q.finished_at = now(); toast(status === 'concluida' ? 'Missão concluída — foi para o histórico' : 'Missão fracassada — foi para o histórico'); }
  else if (!FINISHED.includes(status) && was) { q.finished_at = null; q.pos = null; toast('Missão voltou para o quadro'); }
  else toast('Situação: ' + STATUS[status]);
  DB.save();
}
let pickT = null, pickOpened = false;
document.addEventListener('click', e => {
  if (e.target.id !== 'pdfPick') return;
  pickOpened = false; clearTimeout(pickT);
  pickT = setTimeout(() => { if (!pickOpened && M && M.kind === 'pdfImport') { M.help = true; $('#pdfHelp')?.classList.remove('hidden'); } }, 1600);
}, true);
const markPicked = () => { pickOpened = true; };
window.addEventListener('blur', markPicked);
document.addEventListener('visibilitychange', () => { if (document.hidden) markPicked(); });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('.drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
document.addEventListener('dragleave', e => { const d = e.target.closest && e.target.closest('.drop'); if (d) d.classList.remove('over'); });
document.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('.drop'); if (d) { e.preventDefault(); d.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) handlePdf(f); } });

// ---------- início ----------
playIntro();
setTimeout(boot, 60);
function boot() {
DB.load();
if (CLOUD) cloudStart();
else {
  try { const s = localStorage.getItem(KEY + '_s'); if (s && DB.user(s)) { S.user = s; S.view = 'home'; } } catch (e) {}
  render();
}
}
</script>
</body>
</html>
